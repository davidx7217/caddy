<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    a { color: #0a7d3f; } a:hover { color: #075c2e; }
  </style>
</helmet>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: 100%">
  <div style="background: #e9ecef; padding: 28px; display: flex; flex-direction: column; gap: 16px">
    <div style="font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: #6b7280">Light</div>
      <div style="width: 340px; padding: 14px; background: #fff; color: #14161a; font-size: 13px; line-height: 1.45; border: 1px solid #e3e6ea; border-radius: 10px">
        <h1 style="font-size: 15px; font-weight: 650; margin: 0">Card Picker</h1>
        <div style="color: #6b7280; font-size: 11px">No cards added yet.</div>
        <h2 style="font-size: 10px; margin: 14px 0 6px">&nbsp;</h2>
        <span style="display: inline-block; background: #f4f6f8; border: 1px solid #e3e6ea; border-radius: 7px; padding: 4px 9px; font-size: 11px; color: #14161a">Manage my cards</span>
      </div>
  </div>
  <div style="background: #0d0f12; padding: 28px; display: flex; flex-direction: column; gap: 16px">
    <div style="font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: #9aa1ab">Dark</div>
      <div style="width: 340px; padding: 14px; background: #16181c; color: #e8eaed; font-size: 13px; line-height: 1.45; border: 1px solid #2a2e35; border-radius: 10px">
        <h1 style="font-size: 15px; font-weight: 650; margin: 0">Card Picker</h1>
        <div style="color: #9aa1ab; font-size: 11px">No cards added yet.</div>
        <h2 style="font-size: 10px; margin: 14px 0 6px">&nbsp;</h2>
        <span style="display: inline-block; background: #1f2228; border: 1px solid #2a2e35; border-radius: 7px; padding: 4px 9px; font-size: 11px; color: #e8eaed">Manage my cards</span>
      </div>
  </div>
</div>
</x-dc>
</body>
</html>
